<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily System Stabilizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #e6e6e6; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .btn-collect { transition: background-color 0.15s, transform 0.1s; }
        .btn-collect:hover { background-color: #238636; }
        .btn-collect:active { transform: scale(0.98); }
        .resource-icon { font-size: 2rem; }
    </style>
</head>
<body class="p-4 md:p-8 flex justify-center items-center min-h-screen">

    <div id="app" class="w-full max-w-lg">
        <div class="card p-6 rounded-xl shadow-2xl">
            <h1 class="text-3xl font-bold text-center mb-6 text-green-400">The Daily System Stabilizer</h1>
            <p class="text-sm text-center mb-8 text-gray-400">Your consistent, low-stakes ritual for predictable rewards.</p>

            <!-- Resource Display -->
            <div id="resource-display" class="grid grid-cols-2 gap-4 mb-8">
                <!-- Data is loaded by JavaScript -->
            </div>

            <!-- Collection Button -->
            <button id="collect-button" class="btn-collect w-full py-4 rounded-xl font-semibold text-lg bg-green-500 text-white shadow-lg hover:shadow-xl transition duration-200" onclick="collectDaily()">
                Collect Daily Resources
            </button>

            <!-- Status Message -->
            <p id="status-message" class="text-center mt-6 text-sm italic text-yellow-400"></p>
        </div>
    </div>

    <script type="module">
        // Helper function for local storage access
        const STORAGE_KEY = 'dailySystemData';

        const resources = [
            { name: 'System Integrity Tokens', key: 'integrity', icon: '✅', dailyAmount: 10, total: 0 },
            { name: 'Workflow Efficiency Units', key: 'efficiency', icon: '⚙️', dailyAmount: 5, total: 0 },
            { name: 'Creative Focus Gems', key: 'focus', icon: '✨', dailyAmount: 2, total: 0 }
        ];

        let state = {
            lastCollectionDate: null,
            resources: resources
        };

        function loadState() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                if (storedData) {
                    const loadedState = JSON.parse(storedData);
                    // Merge loaded totals into the current resource definitions
                    state.lastCollectionDate = loadedState.lastCollectionDate;
                    state.resources.forEach((resource, index) => {
                        const loadedResource = loadedState.resources.find(r => r.key === resource.key);
                        if (loadedResource) {
                            resource.total = loadedResource.total;
                        }
                    });
                }
            } catch (e) {
                console.error("Error loading state:", e);
            }
        }

        function saveState() {
            try {
                // Only save the necessary state (last date and current totals)
                const stateToSave = {
                    lastCollectionDate: state.lastCollectionDate,
                    resources: state.resources.map(r => ({ key: r.key, total: r.total }))
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
            } catch (e) {
                console.error("Error saving state:", e);
            }
        }

        function isNewDay() {
            if (!state.lastCollectionDate) return true;
            const lastDate = new Date(state.lastCollectionDate);
            const today = new Date();

            return today.toDateString() !== lastDate.toDateString();
        }

        function updateDisplay() {
            const displayDiv = document.getElementById('resource-display');
            displayDiv.innerHTML = state.resources.map(r => `
                <div class="card p-4 rounded-lg flex items-center space-x-3">
                    <span class="resource-icon">${r.icon}</span>
                    <div>
                        <p class="text-xs font-medium text-gray-400">${r.name}</p>
                        <p class="text-xl font-bold text-white">${r.total.toLocaleString()}</p>
                    </div>
                </div>
            `).join('');

            const collectButton = document.getElementById('collect-button');
            const statusMessage = document.getElementById('status-message');

            if (isNewDay()) {
                collectButton.disabled = false;
                collectButton.classList.remove('bg-gray-600', 'cursor-not-allowed');
                collectButton.classList.add('bg-green-500');
                collectButton.textContent = 'Collect Daily Resources';
                statusMessage.textContent = 'Ready for today\'s ritual.';
            } else {
                collectButton.disabled = true;
                collectButton.classList.remove('bg-green-500');
                collectButton.classList.add('bg-gray-600', 'cursor-not-allowed');
                
                const nextCollection = new Date();
                nextCollection.setDate(nextCollection.getDate() + 1);
                nextCollection.setHours(0, 0, 0, 0); // Set to midnight of the next day

                const now = new Date();
                const diffMs = nextCollection.getTime() - now.getTime();
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

                statusMessage.textContent = `Collected for today. Next collection in ${diffHours}h ${diffMins}m.`;
                collectButton.textContent = 'Already Collected';
            }
        }

        function collectDaily() {
            if (!isNewDay()) return;

            state.resources.forEach(r => {
                r.total += r.dailyAmount;
            });

            state.lastCollectionDate = new Date().toISOString();

            saveState();
            updateDisplay();

            document.getElementById('status-message').textContent = `+${resources[0].dailyAmount} Tokens! Daily ritual complete.`;
        }

        // Initialize the App
        loadState();
        updateDisplay();
        
        // Timer to update the remaining time countdown
        setInterval(updateDisplay, 60000); // Update every minute
    </script>
</body>
</html>
