<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh Hunt - Content Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 6px; }
    

        /* ===== Synthwave Theme (matches portfolio home redesign) ===== */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #07020d;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(80, 0, 160, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(180, 0, 90, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: #cbd5e1;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
        }
        .subtle-grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(77, 184, 200, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 184, 200, 0.025) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .container, .max-w-5xl {
            position: relative;
            z-index: 1;
            background-color: rgba(16, 10, 31, 0.75) !important;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.15) !important;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.6), 0 0 30px rgba(80, 0, 160, 0.05) !important;
        }
        h1, h1.text-indigo-800 {
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(to bottom, #ffffff 0%, #e8e8e8 40%, #b0b8c8 75%, #8899aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0px 0px 8px rgba(77, 184, 200, 0.2));
        }
        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #4db8c8 !important;
            border-bottom: 2px solid rgba(77, 184, 200, 0.15) !important;
            text-shadow: 0 0 10px rgba(77, 184, 200, 0.15);
        }
        h3 { color: #c0527a !important; }
        strong { color: #f1f5f9; font-weight: 700; }
        p, li, span { color: #cbd5e1; }
        ul li::marker { color: #4db8c8; }
        a { color: #4db8c8; }
        a:hover { color: #c0527a; }
        .meta-info, .meta-info span { color: #94a3b8 !important; }
        .image-container img {
            border: 1px solid rgba(77, 184, 200, 0.12) !important;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 20px rgba(0,240,255,0.08) !important;
        }
        .image-caption { color: #94a3b8 !important; }
        .pipeline-graphic {
            background-color: rgba(16,10,31,0.85) !important;
            border: 1px solid rgba(77, 184, 200, 0.12) !important;
        }
        .pipeline-graphic h4 { color: #4db8c8 !important; font-family:'Orbitron',sans-serif; }
        .pipeline-graphic pre {
            background-color: rgba(0,0,0,0.4) !important;
            color: #4db8c8 !important;
            border: 1px solid rgba(0,240,255,0.1);
        }
        .pipeline-graphic ul li::before { color: #4db8c8; }
        .disclaimer, .bg-yellow-50 {
            background-color: rgba(200, 184, 74, 0.04) !important;
            border-color: #c8b84a !important;
            color: #fde68a !important;
        }
        .border-yellow-200 { border-color: rgba(200, 184, 74, 0.3) !important; }
        .text-yellow-800 { color: #fde68a !important; }
        .contact-info, .text-gray-500, .text-gray-400 { color: #94a3b8 !important; }
        .contact-info a, .text-indigo-600, .text-blue-600 { color: #4db8c8 !important; text-decoration: none; }
        .contact-info a:hover, .text-indigo-600:hover, .text-blue-600:hover,
        .hover\:text-indigo-800:hover { color: #c0527a !important; }
        .text-gray-700, .text-gray-800, .text-gray-900, .text-indigo-800 { color: #e2e8f0 !important; }
        .border-gray-200, .border-gray-100, .border-indigo-100, .border-indigo-200 { border-color: rgba(77, 184, 200, 0.12) !important; }
        .bg-white, .bg-indigo-50, .bg-slate-50 {
            background-color: rgba(16,10,31,0.6) !important;
        }
        .back-to-portfolio-btn, .bg-gray-600 {
            background-color: transparent !important;
            border: 1px solid #c0527a !important;
            color: #c0527a !important;
            box-shadow: 0 0 8px rgba(192, 82, 122, 0.1);
            transition: all 0.2s ease-in-out;
        }
        .back-to-portfolio-btn:hover, .hover\:bg-gray-700:hover {
            background-color: #c0527a !important;
            color: #07020d !important;
            box-shadow: 0 0 14px rgba(192, 82, 122, 0.3);
        }
        .bg-indigo-600 {
            background-color: transparent !important;
            border: 1px solid #4db8c8 !important;
            color: #4db8c8 !important;
            box-shadow: 0 0 10px rgba(77, 184, 200, 0.12);
        }
        .hover\:bg-indigo-700:hover {
            background-color: #4db8c8 !important;
            color: #07020d !important;
            box-shadow: 0 0 14px rgba(77, 184, 200, 0.3);
        }
        ::selection { background: #c0527a; color: #ffffff; }
    </style>
</head>
